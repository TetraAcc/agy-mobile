<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="AGY Remote Hub">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AGY Remote">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <title>AGY Remote Hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      background-color: #111113;
      color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #F7F7F8;
        color: #18181B;
      }
    }
    #agy-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background-color: inherit;
      transition: opacity 0.22s ease-out;
    }
    #agy-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #agy-splash img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    #agy-splash .title {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0.78;
    }
  </style>
</head>
<body>
  <div id="agy-splash">
    <img src="apple-touch-icon.png?v=2" alt="AGY Remote">
    <div class="title">AGY Remote</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('agy-splash');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 240);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
