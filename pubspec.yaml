name: agy_remote
description: "Cross-platform remote hub for Google Antigravity"
publish_to: 'none'
version: 2.1.0+21

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.4.1
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.7+1
  markdown: ^7.2.2
  flutter_highlight: ^0.7.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
